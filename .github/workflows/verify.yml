name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dependency
      - run: pnpm test:network
      - run: pnpm test:deployment
      - run: pnpm test:agents
      - run: pnpm test:agent-service
      - run: pnpm test:rfq
      - run: pnpm test:vault
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm test:rfq-runtime
      - run: pnpm test:vault-runtime
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: pnpm test:rfq-ui
      - run: pnpm test:vault-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
      - run: pnpm audit --prod --audit-level high
        if: always()
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts
