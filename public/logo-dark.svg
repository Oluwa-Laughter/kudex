<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGradDark" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="portalGradDark" x1="180" y1="20" x2="20" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glowDark" cx="100" cy="100" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="70" fill="url(#glowDark)"/>

  <!-- Outer Geometric Portal Ring -->
  <circle cx="100" cy="100" r="82" stroke="url(#portalGradDark)" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round"/>

  <!-- Shield Geometry: Interlocking Hexagonal Struts -->
  <polygon points="100,24 165,60 165,140 100,176 35,140 35,60" stroke="#334155" stroke-width="4" fill="none"/>
  <polygon points="100,42 150,70 150,130 100,158 50,130 50,70" stroke="url(#shieldGradDark)" stroke-width="6" fill="#090d16" fill-opacity="0.95"/>

  <!-- Internal Cross-Chain Nodes -->
  <line x1="100" y1="42" x2="100" y2="158" stroke="#34d399" stroke-width="3"/>
  <line x1="50" y1="70" x2="150" y2="130" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="50" y1="130" x2="150" y2="70" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- Core Confidential Shield Vertex Nodes -->
  <circle cx="100" cy="42" r="6" fill="#34d399"/>
  <circle cx="150" cy="70" r="6" fill="#60a5fa"/>
  <circle cx="150" cy="130" r="6" fill="#34d399"/>
  <circle cx="100" cy="158" r="6" fill="#60a5fa"/>
  <circle cx="50" cy="130" r="6" fill="#34d399"/>
  <circle cx="50" cy="70" r="6" fill="#60a5fa"/>

  <!-- Inner Hyper-Node Sentinel Core -->
  <circle cx="100" cy="100" r="14" fill="#0f172a"/>
  <circle cx="100" cy="100" r="7" fill="#34d399"/>
</svg>
